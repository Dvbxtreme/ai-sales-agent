<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 380px; min-height: 200px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0b; color: #e4e4e7; }
    .header { padding: 16px; border-bottom: 1px solid #27272a; }
    .header h1 { font-size: 1rem; background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header .sub { font-size: .75rem; color: #52525b; margin-top: 2px; }
    .content { padding: 16px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: .9rem; transition: all .2s; }
    .btn-primary { background: linear-gradient(135deg, #a78bfa, #60a5fa); color: #fff; }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .status { text-align: center; padding: 12px; color: #a1a1aa; font-size: .85rem; }
    .result { margin-top: 12px; }
    .result h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .5px; color: #71717a; margin-bottom: 6px; }
    .result ul { list-style: none; }
    .result li { padding: 8px; margin-bottom: 4px; border-radius: 6px; font-size: .85rem; }
    .complaint { background: #450a0a; border-left: 3px solid #dc2626; }
    .praise { background: #052e16; border-left: 3px solid #22c55e; }
    .error { background: #450a0a; border: 1px solid #dc2626; padding: 10px; border-radius: 8px; font-size: .85rem; margin-top: 8px; }
    .footer { padding: 12px 16px; border-top: 1px solid #27272a; text-align: center; font-size: .75rem; color: #52525b; }
    .footer a { color: #a78bfa; text-decoration: none; }
    .stats { display: flex; gap: 8px; margin: 8px 0; font-size: .75rem; color: #71717a; }
    .spinner { width: 16px; height: 16px; border: 2px solid #3f3f46; border-top-color: #a78bfa; border-radius: 50%; animation: spin .6s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Review Analyzer</h1>
    <div class="sub">AI-powered competitor insights</div>
  </div>

  <div class="content">
    <div id="initial">
      <p style="font-size:.85rem;color:#a1a1aa;margin-bottom:12px">Analyze customer reviews on Amazon, Allegro, Etsy to find top complaints and praises.</p>
      <button id="analyzeBtn" class="btn btn-primary">🔍 Analyze This Page</button>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <div class="status">Scraping reviews & analyzing with AI...</div>
    </div>

    <div id="result" class="hidden">
      <div class="stats">
        <span id="reviewCount"></span>
        <span>·</span>
        <span id="productName"></span>
      </div>
      <div class="result" id="complaints">
        <h3>😤 Top Complaints</h3>
        <ul id="complaintList"></ul>
      </div>
      <div class="result" id="praises" style="margin-top:16px">
        <h3>⭐ Top Praises</h3>
        <ul id="praiseList"></ul>
      </div>
      <div class="result" id="summary" style="margin-top:12px">
        <h3>📊 Summary</h3>
        <p id="summaryText" style="font-size:.85rem;color:#a1a1aa;padding:8px;background:#18181b;border-radius:6px"></p>
      </div>
    </div>

    <div id="error" class="hidden error"></div>
  </div>

  <div class="footer">
    Powered by <a href="https://ollama.com" target="_blank">Ollama</a> (local AI) ·
    <a href="https://cyruliks.gumroad.com/l/ghhvqh" target="_blank">Get the full AI SaaS Kit $399</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
